  const card=el("div","q"); card.id="q-"+q.id; card.dataset.idx=idx;
  card.innerHTML=`<div class="qhead">
      <span class="qno" tabindex="-1">Q${idx+1} <small style="color:var(--faint);font-weight:400">/ ${ids.length}</small></span>
      <span class="dtag" style="background:var(${DOMAIN_VAR[q.domain]})">D${q.domain}</span>
      <span class="dchip">${DOMAIN_SHORT[q.domain]}</span>
      <button type="button" class="flagbtn ${flagged?'on':''}" id="flagBtn" aria-pressed="${flagged?'true':'false'}"
        title="Mark this question to come back to it before you submit (press F)">${flagged?'★ Marked':'☆ Mark for review'}</button>
    </div>
    <div class="stem">${rich(q.stem)}</div>${opts}
    <div class="qnav">
      <button type="button" id="prevBtn" ${idx===0?'disabled':''}>← Previous</button>
      <span class="qnav-mid">Question ${idx+1} of ${ids.length}</span>
      <button type="button" id="nextBtn" class="primary">${last?'Review &amp; submit →':'Next →'}</button>
    </div>`;
  quiz.innerHTML=""; quiz.appendChild(card);
  quiz.onchange=e=>{ if(e.target.name&&e.target.name.startsWith("q")) pickAnswer(e.target.name.slice(1),e.target.value); };
  $("#prevBtn").onclick=()=>gotoQ(idx-1);
  $("#nextBtn").onclick=()=> last?showReviewScreen():gotoQ(idx+1);
  $("#flagBtn").onclick=()=>toggleFlag(q.id);
  setCurrent(String(q.id));
  if(exam.paused) $$("#quiz input").forEach(i=>i.disabled=true);
  const h=quiz.querySelector(".qno"); if(h){ try{h.focus({preventScroll:true});}catch(e){} }
}
/* set an answer (used by both click/change and keyboard) */
function pickAnswer(id,L){
  if(!exam||exam.paused||exam.submitted)return;
  id=String(id);
  if(!exam.question_ids.some(x=>String(x)===id))return;
  exam.answers[id]=L;
  const card=$("#q-"+id);
  if(card){ const inp=card.querySelector('input[value="'+L+'"]'); if(inp) inp.checked=true;
    card.querySelectorAll(".opt").forEach(o=>o.classList.toggle("picked",o.dataset.letter===L)); }
  persistExam(); updateProgress();
}
function buildNav(qs){
  const nav=$("#navgrid"); if(!nav)return; nav.innerHTML="";
  qs.forEach((q,i)=>{ const c=el("button","navchip",String(i+1));
    c.type="button"; c.id="nav-"+q.id; c.dataset.qid=String(q.id);
    c.setAttribute("aria-label","Question "+(i+1));
    c.onclick=()=>gotoQ(i); nav.appendChild(c); });
}
/* current-question tracking (keyboard + navigator target). One question renders at a time. */
let currentQId=null, examStage="question"; // examStage: "question" | "review"
function setCurrent(id){ if(id==null)return; currentQId=String(id);
  $$("#navgrid .navchip").forEach(c=>c.classList.toggle("current", c.dataset.qid===currentQId)); }
function gotoQ(i){ if(!exam||exam.submitted)return; const ids=exam.question_ids.map(String); if(!ids.length)return;
  i=Math.max(0,Math.min(ids.length-1,i)); currentQId=ids[i]; examStage="question";
  renderCurrentQuestion(); updateProgress(); persistExam(); scrollTopSmooth(); }
function updateProgress(){
  const qs=exam.question_ids; const ans=qs.filter(id=>exam.answers[id]).length;
  const pm=$("#progMini"); if(pm) pm.textContent=ans+"/"+qs.length;
  const chips=$$("#navgrid .navchip");
  qs.forEach((id,i)=>{ const c=chips[i]; if(!c)return;
    const answered=!!exam.answers[id], flagged=!!(exam.flagged&&exam.flagged[id]);
    if(!exam.submitted) c.classList.toggle("answered",answered);
    c.classList.toggle("flagged",flagged);
    c.setAttribute("aria-label","Question "+(i+1)+(answered?", answered":", not answered")+(flagged?", marked for review":""));
  });
  const jb=$("#jumpBtn"); if(jb) jb.disabled = exam.submitted || ans===qs.length;
}
/* toggle "mark for review" on a question */
function toggleFlag(id){ if(!exam||exam.submitted)return; id=String(id);
  exam.flagged=exam.flagged||{};
  if(exam.flagged[id]) delete exam.flagged[id]; else exam.flagged[id]=true;
  const on=!!exam.flagged[id], b=$("#flagBtn");
  if(b && String(currentQId)===id){ b.classList.toggle("on",on); b.setAttribute("aria-pressed",on?"true":"false");
    b.textContent=on?'★ Marked':'☆ Mark for review'; }
  persistExam(); updateProgress();
}
/* timer — counts up; a timed exam counts DOWN, and at zero it flags "over time" (it NEVER auto-submits:
   this is practice, so the learner always finishes every question). */
setInterval(()=>{ if(exam&&exam.answers&&!exam.paused&&!exam.submitted){  // only ticks for a live, unsubmitted exam
  exam.elapsed++;
  if(exam.limit_seconds && !exam.over_time && exam.elapsed>=exam.limit_seconds){ exam.over_time=true; showTimeUp(); persistExam(); }
  updateClock();
  if(exam.elapsed%5===0)persistExam();
} },1000);
function updateClock(){ const c=$("#clock"); if(!c)return;
  if(exam&&exam.limit_seconds){ const rem=exam.limit_seconds-exam.elapsed;
    if(rem>0){ c.textContent=fmtTime(rem); c.classList.toggle("low",rem<=60); c.classList.remove("over"); c.title="Time remaining"; }
    else { c.textContent="+"+fmtTime(-rem); c.classList.remove("low"); c.classList.add("over"); c.title="You are over the time limit. Finish at your own pace."; } }
  else { c.textContent=fmtTime(exam?exam.elapsed:0); c.classList.remove("low","over"); c.title="Elapsed"; } }
function showTimeUp(){ const b=$("#timeUpBanner"); if(b) b.style.display="flex"; }
function hideTimeUp(){ const b=$("#timeUpBanner"); if(b) b.style.display="none"; }
function setPaused(p){ if(!exam)return; exam.paused=p; $("#overlay").classList.toggle("show",p);
  $$("#quiz input").forEach(i=>i.disabled=p); $("#submitBtn").disabled=p||exam.submitted; persistExam(); }
$("#pauseBtn").onclick=()=>setPaused(true);
$("#resumeBtn").onclick=()=>setPaused(false);
$("#jumpBtn").onclick=()=>{ if(!exam||exam.submitted)return;
  const ids=exam.question_ids.map(String);
  const idx=ids.findIndex(id=>!exam.answers[id]);
  if(idx>=0) gotoQ(idx); };
$("#quitBtn").onclick=()=>quitExam();
$("#clock").textContent="00:00:00";

/* keyboard: 1-4 / A-D pick the current option; J/K or ←/→/↑/↓ move between questions; F flags */
document.addEventListener("keydown",e=>{
  if(currentView!=="exam"||!exam||exam.paused||exam.submitted)return;
  if(examStage!=="question")return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=(e.target&&e.target.tagName)||""; if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
  const ids=exam.question_ids.map(String); if(!ids.length)return;
  let idx=ids.indexOf(String(currentQId)); if(idx<0)idx=0;
  const k=e.key.toLowerCase();
  if("1234".indexOf(k)>=0){ pickAnswer(ids[idx],["A","B","C","D"][k-1]); e.preventDefault(); }
  else if("abcd".indexOf(k)>=0){ pickAnswer(ids[idx],k.toUpperCase()); e.preventDefault(); }
  else if(k==="j"||e.key==="ArrowRight"||e.key==="ArrowDown"){ gotoQ(idx+1); e.preventDefault(); }
  else if(k==="k"||e.key==="ArrowLeft"||e.key==="ArrowUp"){ gotoQ(idx-1); e.preventDefault(); }
  else if(k==="f"){ toggleFlag(ids[idx]); e.preventDefault(); }
});
/* review-before-submit gate: lists unanswered + flagged questions, each a jump target */
function showReviewScreen(){
  if(!exam||exam.submitted)return;
  examStage="review";
  const ids=exam.question_ids.map(String);
  const unanswered=ids.filter(id=>!exam.answers[id]);
  const flagged=ids.filter(id=>exam.flagged&&exam.flagged[id]);
  const chips=arr=>`<div class="navgrid">`+arr.map(id=>{ const i=ids.indexOf(id);
      const an=!!exam.answers[id], fl=exam.flagged&&exam.flagged[id];
      return `<button type="button" class="navchip${an?' answered':''}${fl?' flagged':''}" data-jump="${id}" aria-label="Go to question ${i+1}">${i+1}</button>`;
    }).join("")+`</div>`;
  const quiz=$("#quiz");
  quiz.innerHTML=`<div class="q reviewgate">
      <div class="qhead"><span class="qno" tabindex="-1">Review before submit</span></div>
      <p class="hint">You've answered <b>${ids.length-unanswered.length}</b> of <b>${ids.length}</b> question${ids.length===1?"":"s"}.${flagged.length?` <b>${flagged.length}</b> marked for review.`:""}</p>
      ${unanswered.length?`<div class="rg-block"><div class="rg-lbl">Unanswered · ${unanswered.length}</div>${chips(unanswered)}</div>`:`<div class="rg-ok">✅ All questions answered.</div>`}
      ${flagged.length?`<div class="rg-block"><div class="rg-lbl">Marked for review · ${flagged.length}</div>${chips(flagged)}</div>`:""}
      <div class="qnav">
        <button type="button" id="rgBack">← Return to exam</button>
        <button type="button" id="rgSubmit" class="primary">Submit exam${unanswered.length?` · ${unanswered.length} blank`:""}</button>
      </div>
    </div>`;
  $("#rgBack").onclick=()=>{ examStage="question"; renderCurrentQuestion(); scrollTopSmooth(); };
  $("#rgSubmit").onclick=()=>submitExam();
  $$("#quiz .navchip[data-jump]").forEach(c=>c.onclick=()=>gotoQ(ids.indexOf(String(c.dataset.jump))));
  scrollTopSmooth();
  const h=quiz.querySelector(".qno"); if(h){ try{h.focus({preventScroll:true});}catch(e){} }
}
/* quit without submitting — progress is saved so it can be resumed from the dashboard */
function quitExam(){
  if(!exam||exam.submitted)return;
  if(!confirm("Quit this exam without submitting? Your progress is saved. You can carry on from the dashboard."))return;
  persistExam();
  inProgress=loadLS(LS_INPROGRESS,null);
  exam=null; examStage="question";
  $("#examControls").style.display="none";
  renderDashboard(); showView("dashboard");
}

function resumeExam(){ if(!inProgress)return;
  exam={exam_id:inProgress.exam_id,mode:inProgress.mode,domains:inProgress.domains||[],
    question_ids:inProgress.question_ids,answers:inProgress.answers||{},flagged:inProgress.flagged||{},elapsed:inProgress.elapsed||0,
    paused:false,submitted:false,limit_seconds:inProgress.limit_seconds||0,over_time:!!inProgress.over_time,started_ts:inProgress.started_ts};
  currentQId = inProgress.current!=null?String(inProgress.current):(exam.question_ids.length?String(exam.question_ids[0]):null);
  renderExam(); updateClock(); showView("exam");
}
function discardInProgress(){ if(!confirm("Discard the exam in progress? This can't be undone."))return;
  inProgress=null; try{localStorage.removeItem(LS_INPROGRESS);}catch(e){} renderDashboard(); }
/* discard finished-but-unrecorded sittings from local storage (recorded progress in the store is untouched) */
function discardPending(){ if(!pending.length)return;
  const n=pending.length;
  if(!confirm(`Discard ${n} unrecorded exam${n>1?"s":""}? You cannot undo this. Your recorded progress in stats.json stays as it is.`))return;
  pending=[]; saveLS(LS_PENDING,pending); renderDashboard(); }

/* submit + grade */
function submitExam(){
  if(!exam||exam.submitted)return;
  exam.submitted=true; exam.paused=false; $("#overlay").classList.remove("show");
  $("#submitBtn").disabled=true; $("#pauseBtn").disabled=true;
  const jb=$("#jumpBtn"); if(jb) jb.disabled=true;
  try{localStorage.removeItem(LS_INPROGRESS);}catch(e){} inProgress=null;
  const result=grade();
  pending.push(result); saveLS(LS_PENDING,pending);
  renderResults(result);
  showView("results");
}
$("#submitBtn").onclick=()=>{
  if(!exam||exam.submitted)return;
  if(examStage==="review"){ submitExam(); return; }   // already on the review gate → finalize
  showReviewScreen();                                  // otherwise open the review-before-submit gate
};
function grade(){
  const qs=questionsOf(exam.question_ids);
  const answers=[]; const perDom={}; let correct=0;
  qs.forEach(q=>{ const chosen=exam.answers[q.id]||null; const isc=chosen===q.correct; if(isc)correct++;
    answers.push({id:q.id,domain:q.domain,chosen,correct:q.correct,is_correct:isc});
    (perDom[q.domain]||(perDom[q.domain]={correct:0,total:0})); perDom[q.domain].total++; if(isc)perDom[q.domain].correct++;
  });
  return { exam_id:exam.exam_id, type:"mock", mode:exam.mode, count:qs.length, ts:exam.started_ts,
    time_spent_seconds:exam.elapsed, limit_seconds:exam.limit_seconds||0, over_time:!!exam.over_time,
    score:{correct,total:qs.length}, per_domain:perDom, answers };
}

/* ================= RESULTS ================= */
let lastResult=null;
function renderResults(r){
  lastResult=r;
  const v=$("#view-results");
  const qs=questionsOf((r.answers||[]).map(a=>a.id));  // drive off the result, not the live exam global
  const pct=r.score.total?Math.round(100*r.score.correct/r.score.total):0;
  const passed=pct>=PASS_PCT;
  const msg = passed? `Above the ${PASS_PCT}% pass line 🎉` : `Below the ${PASS_PCT}% pass line`;
  let html=`<div class="card pad result-hero">
      <div class="ring" style="--p:${pct}"><div class="rv"><b style="color:${passed?'var(--ok)':'var(--accent2)'}">${pct}%</b><span>score</span></div></div>
      <div><div class="verdict-msg">${r.score.correct} / ${r.score.total} correct</div>
        <div class="sub">${msg} · ${fmtTime(r.time_spent_seconds)}${r.over_time?' · ⏳ over time':(r.limit_seconds?' · within time':'')} · ${esc(r.mode)} mode</div></div>
    </div>`;

  /* per-domain */
  html+=`<section class="block"><h2>By domain</h2><div class="card pad">`;
  Object.keys(r.per_domain).map(Number).sort((a,b)=>a-b).forEach(d=>{
    const p=r.per_domain[d]; const dp=p.total?Math.round(100*p.correct/p.total):0;
    html+=`<div class="dbar-row"><div class="dbar-top">
        <span class="dot" style="background:var(${DOMAIN_VAR[d]})"></span>
        <span class="dname"><b>D${d}</b> <span class="dn-full">${DOMAIN_NAMES[d]}</span></span>
        <span class="dval">${dp}% <small>· ${p.correct}/${p.total}</small></span></div>
      <div class="track"><div class="fill" style="width:${dp}%;--dc:var(${DOMAIN_VAR[d]});background:var(--dc)"></div></div></div>`;
  });
  html+=`</div></section>`;

  /* export */
  html+=`<section class="block"><h2>Record this result</h2>
    <div class="banner info"><span class="ic">💾</span><div>This result is only saved after you record it.
      Copy the JSON, run <span class="kbd">/ccaf:result</span> in Claude Code, then paste it.
      ${pending.length>1?`<br><b>Tip:</b> you have ${pending.length} unrecorded exams. The box below holds all of them, so one paste records everything.`:""}</div></div>
    <div class="export-box">
      <label for="jsonOut" class="sr-only">Exam results as JSON. Select all and copy.</label>
      <textarea id="jsonOut" readonly aria-label="Exam results as JSON. Select all and copy."></textarea>
      <div class="copyrow"><button class="primary" id="copyBtn">Copy ${pending.length>1?"all unrecorded":"results"} as JSON</button>
        <span id="copyMsg" class="copy-ok" style="display:none">Copied ✓</span>
        <span class="hint">The text box always works. The button can be blocked on a <code>file://</code> page.</span></div>
    </div></section>`;

  /* review — misses-only by default, with an All toggle and a domain filter */
  const missed=r.answers.filter(a=>!a.is_correct);
  const examDomains=[...new Set(qs.map(q=>q.domain))].sort((a,b)=>a-b);
  reviewState={showAll:false, domains:new Set(examDomains)};
  const domChips=examDomains.map(d=>`<div class="chip sel" data-rdom="${d}"><span class="dot" style="background:var(${DOMAIN_VAR[d]})"></span>D${d} ${DOMAIN_SHORT[d]}</div>`).join("");
  html+=`<section class="block"><h2>Review <span class="count" id="revCount"></span></h2>
    <div class="review-controls">
      <div class="seg" id="revToggle">
        <button class="seg-btn sel" data-all="0">Misses only</button>
        <button class="seg-btn" data-all="1">All</button></div>
      ${examDomains.length>1?`<div class="chips" id="revDomains">${domChips}</div>`:""}
    </div>
    <div id="review"></div></section>`;
  html+=`<hr class="soft"><div style="display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap">
    <button onclick="renderDashboard();showView('dashboard')">← Dashboard</button>
    <button class="primary" onclick="renderConfig();showView('config')">Another exam →</button></div>`;
  v.innerHTML=html;

  $$("#revToggle .seg-btn").forEach(b=>b.onclick=()=>{ reviewState.showAll=b.dataset.all==="1";
    $$("#revToggle .seg-btn").forEach(x=>x.classList.toggle("sel",x===b)); renderReviewList(); });
  $$("#revDomains .chip").forEach(c=>c.onclick=()=>{ const d=+c.dataset.rdom;
    reviewState.domains.has(d)?reviewState.domains.delete(d):reviewState.domains.add(d);
    c.classList.toggle("sel", reviewState.domains.has(d)); renderReviewList(); });
  renderReviewList();
  wireExport();
}
/* (re)populate #review from lastResult + reviewState, without leaving the results view */
let reviewState={showAll:false, domains:new Set()};
function renderReviewList(){
  const rev=$("#review"); if(!rev)return;
  const r=lastResult; if(!r)return;
  const qs=questionsOf((r.answers||[]).map(a=>a.id));
  const showAll=reviewState.showAll, dom=reviewState.domains;
  const missedTotal=r.answers.filter(a=>!a.is_correct).length;
  const cnt=$("#revCount");
  if(cnt) cnt.textContent = showAll ? `${r.answers.length} question${r.answers.length===1?"":"s"}`
                                    : `${missedTotal} miss${missedTotal===1?"":"es"} of ${r.answers.length}`;
  const list=qs.filter(q=>{ const a=r.answers.find(x=>x.id===q.id);
    return a && dom.has(q.domain) && (showAll || !a.is_correct); });
  rev.innerHTML="";
  if(!list.length){
    const clean=(!showAll && missedTotal===0);
    rev.innerHTML=`<div class="empty"><div class="em-ic">${clean?"✅":"🔍"}</div>
      <h3>${clean?"No misses. Nice.":"No questions match this filter."}</h3></div>`;
    return;
  }
  list.forEach(q=>{
    const a=r.answers.find(x=>x.id===q.id); const isc=a.is_correct;
    const qnum=r.answers.map(a=>String(a.id)).indexOf(String(q.id))+1;
    const card=el("div","q graded");
    const opts=["A","B","C","D"].map(L=>{
      let cls="opt", verdict="";
      if(L===q.correct){cls+=" is-correct"; verdict='<span class="verdict">Correct</span>';}
      if(L===a.chosen && !isc){cls+=" is-wrong"; verdict='<span class="verdict">Your pick</span>';}
      return `<div class="${cls}"><span class="lab">${L}</span><span class="otext">${rich(q.options[L])}</span>${verdict}</div>`;
    }).join("");
    const axisB=(q.axis>=1&&q.axis<=5)?`<span class="axisbadge" title="${esc(AXIS_DESC[q.axis])}">Axis ${q.axis} · ${esc(AXIS_NAMES[q.axis])}</span>`:"";
    card.innerHTML=`<div class="qhead"><span class="qno">Q${qnum}</span>
        <span class="dtag" style="background:var(${DOMAIN_VAR[q.domain]})">D${q.domain}</span>
        <span class="badge ${isc?'':'external'}" style="${isc?'background:var(--ok-soft);color:var(--ok)':'background:var(--bad-soft);color:var(--bad)'}">${isc?'✓ correct':'✗ '+(a.chosen?'wrong':'blank')}</span>
        ${axisB}</div>
      <div class="stem">${rich(q.stem)}</div>${opts}
      ${q.explanation?`<div class="explain">${rich(q.explanation)}</div>`:""}`;
    rev.appendChild(card);
  });
}
function exportPayload(){
  // one object if a single pending sitting, else an array (batch) — /ccaf:result accepts either
  return pending.length===1 ? pending[0] : pending.slice();
}
function wireExport(){
  const ta=$("#jsonOut"); if(!ta)return;
  ta.value=JSON.stringify(exportPayload(),null,2);
  ta.addEventListener("focus",e=>e.target.select());
  const btn=$("#copyBtn"), msg=$("#copyMsg");
  btn.onclick=async()=>{ ta.focus(); ta.select();
    try{ await navigator.clipboard.writeText(ta.value); msg.style.display="inline"; msg.textContent="Copied ✓"; }
    catch(e){ const ok=document.execCommand&&document.execCommand("copy");
      msg.style.display="inline"; msg.style.color=ok?"var(--ok)":"var(--bad)";
      msg.textContent=ok?"Copied ✓":"Copy blocked. Select the text and copy it yourself."; } };
}
/* jump straight to export from a dashboard banner */
function showExport(){
  if(!pending.length){ renderDashboard(); return; }
  lastResult=pending[pending.length-1];  // newest unrecorded sitting drives the review view
  renderResults(lastResult); showView("results");
  const box=$("#view-results .export-box"); if(box) box.scrollIntoView({behavior:"smooth"});
}

/* ================= BOOT ================= */
renderDashboard();
showView("dashboard");
</script>
</body>
</html>
